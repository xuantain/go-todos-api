networks:
  servermanager:
    name: servermanager
    external: true
  webservice:
    name: webservice-${HOSTNAME:-default}
    external: false
    ipam:
      driver: default
      config:
        - subnet: 172.${IP:-0}.0.0/16

services:
  webservice:
    build:
      dockerfile: ./docker/images/dockerfile.dev2
    environment:
      - GOPATH=/go
      - AIR_WORKDIR=/go/src/app
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=todos_db
    volumes:
      - ./go-mod-cache:/go/pkg/mod
    expose:
      - "8080"
    networks:
      - servermanager
      - webservice
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=todos_db
    volumes:
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mariadb/data:/var/lib/mysql
    networks:
      - webservice
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5