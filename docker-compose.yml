# Sample instance-project (Go + MariaDB) based on dockops-instance.
# Public HTTP edge must be named `webservice` and listen on 8080.
# Sidecars stay on the `webservice` network only — not on dockops.

x-instance-environment: &instance-environment
  INSTANCE_ID: ${INSTANCE_ID:-}
  INSTANCE_NAME: ${INSTANCE_NAME:-}
  INSTANCE_HOSTNAME: ${INSTANCE_HOSTNAME:-default}
  INSTANCE_IP: ${INSTANCE_IP:-0}
  ID: ${INSTANCE_ID:-}
  NAME: ${INSTANCE_NAME:-}
  HOSTNAME: ${INSTANCE_HOSTNAME:-default}
  IP: ${INSTANCE_IP:-0}

networks:
  dockops:
    name: dockops
    external: true
  webservice:
    name: webservice-${INSTANCE_HOSTNAME:-default}
    ipam:
      driver: default
      config:
        - subnet: 172.${INSTANCE_IP:-0}.0.0/16

volumes:
  db-data:

services:
  webservice:
    build:
      context: .
      dockerfile: ./docker/webservice/Dockerfile
    environment:
      <<: *instance-environment
      APP_ENV: ${APP_ENV:-prod}
      GIN_MODE: ${GIN_MODE:-release}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-todos_db}
    expose:
      - "8080"
    networks:
      dockops:
        aliases:
          - ${INSTANCE_HOSTNAME:-default}
      webservice:
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-todos_db}
    volumes:
      - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - db-data:/var/lib/mysql
    networks:
      - webservice
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
